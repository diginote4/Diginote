<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitone Style</title>
    <link rel="stylesheet" href="../styles/desktop.css">
    <link rel="stylesheet" href="../styles/mobile.css" media="(max-width: 768px)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <ul class="nav__ul">
                <li class="ul__li"><a class="nav__link" href="../index.html">Home</a></li>
                <li class="ul__li"><a class="nav__link" href="#">Music</a></li>
                <li class="ul__li"><a class="nav__link" href="mailto:digitone14@gmail.com">Contact</a></li>
            </ul>
        </nav>
    </header>
    <canvas></canvas>
    <main>
        <section class="foto"></section>
        <aside class="banner">
            <img class="banner__img" src="../assets/img/piano.jpg" alt="Acustic piano aestetic" loading="lazy">
        </aside>
        <section class="about">
            <h1><span>¡My</span> Music!</h1>
            <div class="music__container">
                <div class="about__items">
                    <img src="../assets/img/iyowa.jpg" alt="Puñetazo Cover">
                    <div class="about__info">
                        <div class="track__details">
                            <h3 class="track__title">Puñetazo</h3>
                            <p class="track__artist">Tu Nombre / Artista</p>
                            <div class="track__tags">
                                <span class="badge">J-Pop</span>
                                <span class="badge">Indie</span>
                                <span class="duration">3:45</span>
                            </div>
                        </div>
                        <div class="about__social">
                            <a href="https://youtube.com" target="_blank" class="container__social"
                                title="Escuchar en YouTube">
                                <span class="youtube"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/background.js"></script>
    <script src="../js/musicPlayer.js"></script>
</body>

</html>
